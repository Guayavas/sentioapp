<div class="profile-container">
    <p-toast></p-toast>

    <!-- Encabezado de Perfil -->
    <p-card styleClass="shadow-2 border-round-xl">
        <div class="profile-header-content">
            <div class="avatar-wrapper">
                <p-avatar
                    [label]="getInitials(user.name)"
                    size="xlarge"
                    shape="circle"
                    styleClass="w-6rem h-6rem text-3xl bg-green-100 text-green-800">
                </p-avatar>
                <button *ngIf="isEditing" pButton icon="pi pi-camera" class="p-button-rounded p-button-secondary p-button-sm edit-avatar-btn"></button>
            </div>
            <div>
                <h2 class="user-name">{{user.name}}</h2>
                <p class="user-program">{{user.program}}</p>
            </div>
        </div>
    </p-card>

    <!-- Información Personal -->
    <p-card styleClass="shadow-2 border-round-xl">
        <ng-template pTemplate="header">
            <div class="card-header-flex">
                <h3 class="section-title">Información Personal</h3>

                <p-button *ngIf="!isEditing" label="Editar Perfil" (click)="toggleEdit()" styleClass="p-button-outlined p-button-sm"></p-button>

                <div *ngIf="isEditing" class="action-buttons">
                    <p-button label="Cancelar" (click)="toggleEdit()" styleClass="p-button-text p-button-secondary p-button-sm"></p-button>
                    <p-button label="Guardar" icon="pi pi-save" (click)="saveChanges()" styleClass="p-button-sm"></p-button>
                </div>
            </div>
        </ng-template>

        <div class="form-grid">
            <div class="form-col">
                <label class="form-label">Nombre Completo</label>
                <input pInputText [(ngModel)]="user.name" [disabled]="!isEditing" class="w-full" [ngClass]="{'input-readonly': !isEditing}">
            </div>
            <div class="form-col">
                <label class="form-label">Correo Electrónico</label>
                <input pInputText [(ngModel)]="user.email" [disabled]="!isEditing" class="w-full" [ngClass]="{'input-readonly': !isEditing}">
            </div>
            <div class="form-col">
                <label class="form-label">Teléfono</label>
                <input pInputText [(ngModel)]="user.phone" [disabled]="!isEditing" placeholder="Ingresa tu teléfono" class="w-full" [ngClass]="{'input-readonly': !isEditing}">
            </div>
            <div class="form-col">
                <label class="form-label">ID</label>
                <input pInputText [(ngModel)]="user.studentId" [disabled]="!isEditing" class="w-full" [ngClass]="{'input-readonly': !isEditing}">
            </div>
        </div>
    </p-card>

    <!-- Cambio de Contraseña (Solo en Modo Edición) -->
    <p-card *ngIf="isEditing" header="Cambiar Contraseña" styleClass="shadow-2 border-round-xl">
        <div class="form-grid-single">
            <div class="form-field">
                <label class="form-label">Contraseña Actual</label>
                <p-password [(ngModel)]="passwords.current" [feedback]="false" toggleMask="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>
            <div class="form-field">
                <label class="form-label">Nueva Contraseña</label>
                <p-password [(ngModel)]="passwords.new" [feedback]="true" toggleMask="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>
            <div class="form-field">
                <label class="form-label">Confirmar Nueva Contraseña</label>
                <p-password [(ngModel)]="passwords.confirm" [feedback]="false" toggleMask="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>
        </div>
    </p-card>
</div>
