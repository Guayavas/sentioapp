<div class="max-w-2xl mx-auto space-y-6 animation-fade-in">
    <p-toast></p-toast>

    <!-- Profile Header -->
    <p-card>
        <div class="flex flex-col items-center space-y-4 text-center">
            <div class="relative">
                <p-avatar
                    [label]="getInitials(user.name)"
                    size="xlarge"
                    shape="circle"
                    styleClass="w-24 h-24 text-2xl bg-green-100 text-[#00923f]">
                </p-avatar>
                <button *ngIf="isEditing" pButton icon="pi pi-camera" class="p-button-rounded p-button-secondary p-button-sm absolute -bottom-2 -right-2 h-8 w-8"></button>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900 m-0">{{user.name}}</h2>
                <p class="text-gray-600 m-0 mt-1">{{user.program}}</p>
            </div>
        </div>
    </p-card>

    <!-- Personal Info -->
    <p-card>
        <ng-template pTemplate="header">
            <div class="flex items-center justify-between px-6 pt-6 pb-2">
                <h3 class="text-lg font-bold m-0">Información Personal</h3>

                <p-button *ngIf="!isEditing" label="Editar Perfil" (click)="toggleEdit()" styleClass="bg-[#00923f] border-[#00923f] hover:bg-green-700"></p-button>

                <div *ngIf="isEditing" class="flex space-x-2">
                    <p-button label="Cancelar" (click)="toggleEdit()" styleClass="p-button-outlined p-button-secondary"></p-button>
                    <p-button label="Guardar Cambios" icon="pi pi-save" (click)="saveChanges()" styleClass="bg-[#00923f] border-[#00923f] hover:bg-green-700"></p-button>
                </div>
            </div>
        </ng-template>

        <div class="grid p-fluid">
            <div class="col-12 md:col-6 mb-4">
                <label class="block text-gray-700 font-medium mb-2">Nombre Completo</label>
                <input pInputText [(ngModel)]="user.name" [disabled]="!isEditing" class="w-full" [ngClass]="{'bg-gray-50': !isEditing}">
            </div>
            <div class="col-12 md:col-6 mb-4">
                <label class="block text-gray-700 font-medium mb-2">Correo Electrónico</label>
                <input pInputText [(ngModel)]="user.email" [disabled]="!isEditing" class="w-full" [ngClass]="{'bg-gray-50': !isEditing}">
            </div>
            <div class="col-12 md:col-6 mb-4">
                <label class="block text-gray-700 font-medium mb-2">Teléfono</label>
                <input pInputText [(ngModel)]="user.phone" [disabled]="!isEditing" placeholder="Ingresa tu teléfono" class="w-full" [ngClass]="{'bg-gray-50': !isEditing}">
            </div>
            <div class="col-12 md:col-6 mb-4">
                <label class="block text-gray-700 font-medium mb-2">ID</label>
                <input pInputText [(ngModel)]="user.studentId" [disabled]="!isEditing" class="w-full" [ngClass]="{'bg-gray-50': !isEditing}">
            </div>
        </div>
    </p-card>

    <!-- Change Password (Only in Edit Mode) -->
    <p-card *ngIf="isEditing" header="Cambiar Contraseña">
        <div class="grid p-fluid">
            <div class="col-12 mb-4">
                <label class="block text-gray-700 font-medium mb-2">Contraseña Actual</label>
                <p-password [(ngModel)]="passwords.current" [feedback]="false" toggleMask="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>
            <div class="col-12 mb-4">
                <label class="block text-gray-700 font-medium mb-2">Nueva Contraseña</label>
                <p-password [(ngModel)]="passwords.new" [feedback]="true" toggleMask="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>
            <div class="col-12 mb-4">
                <label class="block text-gray-700 font-medium mb-2">Confirmar Nueva Contraseña</label>
                <p-password [(ngModel)]="passwords.confirm" [feedback]="false" toggleMask="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>
        </div>
    </p-card>
</div>
