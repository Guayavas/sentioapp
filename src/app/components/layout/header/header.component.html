<header class="flex justify-content-between align-items-center px-4 py-2 bg-primary text-white shadow-2">
    <div class="flex align-items-center gap-2">
        <i class="pi pi-briefcase text-2xl"></i>
        <span class="text-xl font-bold">Gestor de Materia</span>
    </div>
    <div class="flex align-items-center gap-2">
        <span class="mr-2">Bienvenido, Usuario</span>
        <p-button label="Importar" icon="pi pi-upload" styleClass="p-button-secondary p-button-sm" (onClick)="onUploadClick.emit()"></p-button>
        <p-button label="Cerrar Sesión" icon="pi pi-sign-out" styleClass="p-button-danger p-button-text text-white" (onClick)="logout()"></p-button>
    </div>
</header>
