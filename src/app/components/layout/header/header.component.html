<header class="bg-[#00923f] border-b border-green-700 shadow-sm">
    <div class="container mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
            <i class="pi pi-verified text-white text-3xl"></i>
          <div>
            <h1 class="text-xl font-semibold text-white m-0">SentioApp</h1>
            <p class="text-sm text-green-100 m-0">Bienestar Estudiantil</p>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex items-center space-x-2">
            <button pButton label="Inicio" icon="pi pi-home" routerLink="/app/home" class="p-button-text text-white hover:bg-green-600 border-none"></button>
            <button pButton label="Perfil" icon="pi pi-user" routerLink="/app/profile" class="p-button-text text-white hover:bg-green-600 border-none"></button>
            <button pButton label="Cerrar Sesión" icon="pi pi-sign-out" (click)="logout()" class="p-button-text text-white hover:bg-green-600 border-none"></button>
        </nav>
      </div>
    </div>
</header>
