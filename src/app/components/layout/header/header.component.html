<header class="flex justify-content-between align-items-center px-4 py-2 bg-primary text-white shadow-2">
    <div class="flex align-items-center gap-2">
        <i class="pi pi-briefcase text-2xl"></i>
        <span class="text-xl font-bold">SentioApp</span>
    </div>
    <div class="flex align-items-center gap-2">
        <!-- Perfil Button Restored -->
        <p-button
            label="Perfil"
            icon="pi pi-user"
            styleClass="p-button-outlined text-white mr-2"
            routerLink="/app/profile"
            pTooltip="Perfil de Usuario">
        </p-button>

        <p-button
            label="Cerrar Sesión"
            icon="pi pi-sign-out"
            styleClass="p-button-danger p-button-text text-white"
            (onClick)="logout()">
        </p-button>
    </div>
</header>
