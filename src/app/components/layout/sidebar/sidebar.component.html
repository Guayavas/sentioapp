<div class="w-18rem bg-white border-right-1 border-gray-200 p-4 h-full flex flex-column">

    <div class="flex flex-column gap-2">
        <button pButton
                label="Explorador de Datos"
                icon="pi pi-eye"
                routerLink="/app/explorer"
                routerLinkActive="bg-primary text-white"
                class="p-button-text justify-content-start w-full text-700 hover:bg-gray-100 text-left px-3 py-3 border-round">
        </button>

        <button pButton
                label="Gráficos"

        </button>

        <button pButton
                label="Clasificador de Información"
                icon="pi pi-cog"

        </button>

        <button pButton
                label="Banco de Datos"
                icon="pi pi-database"
