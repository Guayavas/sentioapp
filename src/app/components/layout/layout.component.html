<div class="min-h-screen flex flex-column bg-gray-50">
    <div class="card">
        <p-menubar [model]="items">
            <ng-template pTemplate="start">
               <div class="flex align-items-center gap-2 mr-4">
                  <span class="font-bold text-xl text-primary">SentioApp</span>
               </div>
            </ng-template>
            <ng-template pTemplate="end">
                <div class="flex align-items-center gap-2">
                    <p-button label="Cerrar Sesión" icon="pi pi-power-off" styleClass="p-button-text p-button-danger"></p-button>
                </div>
            </ng-template>
        </p-menubar>
    </div>

    <div class="flex flex-1">
        <!-- Sidebar Navigation -->
        <div class="w-20rem surface-card border-right-1 surface-border p-3 hidden md:block">
            <div class="flex flex-column gap-2">
                <div class="font-semibold text-xl mb-3 p-2">Herramientas</div>
                <button pButton label="Explorador de Datos" icon="pi pi-eye" class="p-button-text justify-content-start w-full" routerLink="/explorer" routerLinkActive="surface-hover font-bold"></button>
                <button pButton label="Clasificador" icon="pi pi-cog" class="p-button-text justify-content-start w-full" routerLink="/classifier" routerLinkActive="surface-hover font-bold"></button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-4">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
