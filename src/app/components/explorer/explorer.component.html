<div class="explorer-container">
    <p-card header="Explorador de Datos" styleClass="h-full">
        <div class="filters-grid">
            <!-- Buscar Pregunta -->
            <div class="filter-row">
                <label class="label-bold">Buscar y Seleccionar Pregunta:</label>
                <p-autoComplete
                    [(ngModel)]="selectedQuestion"
                    [suggestions]="filteredQuestions"
                    (completeMethod)="filterQuestions($event)"
                    field="text"
                    [dropdown]="true"
                    placeholder="Escribe para buscar..."
                    styleClass="w-full">
                </p-autoComplete>
            </div>

            <!-- Banner de Pregunta Actual -->
             <div class="filter-row" *ngIf="selectedQuestion">
                <div class="question-banner">
                    <div class="banner-label">Pregunta Actual:</div>
                    <div class="banner-text">{{selectedQuestion.text}}</div>
                    <div class="banner-tags">
                        <p-tag [value]="selectedQuestion.category" severity="secondary"></p-tag>
                        <p-tag [value]="selectedQuestion.status || 'active'" severity="success"></p-tag>
                    </div>
                </div>
             </div>

            <!-- Filtros -->
            <div class="filter-col">
                <label class="label-medium">Filtrar por Sede:</label>
                <p-dropdown [options]="sedes" [(ngModel)]="selectedSede" placeholder="Todas las sedes" [showClear]="true" styleClass="w-full"></p-dropdown>
            </div>
            <div class="filter-col">
                <label class="label-medium">Filtrar por Género:</label>
                <p-dropdown [options]="generos" [(ngModel)]="selectedGenero" placeholder="Todos los géneros" [showClear]="true" styleClass="w-full"></p-dropdown>
            </div>
        </div>

        <!-- Navegación de Categorías -->
        <div class="categories-nav">
            <div *ngFor="let cat of categories()" class="category-item">
                <button
                    pButton
                    type="button"
                    [label]="cat"
                    [outlined]="activeCategory !== cat"
                    [ngClass]="{'active': activeCategory === cat, 'p-button-outlined': activeCategory !== cat}"
                    class="category-button"
                    (click)="setActiveCategory(cat)">
                </button>
                <p-badge
                    [value]="getCategoryCount(cat).toString()"
                    severity="contrast"
                    styleClass="category-badge">
                </p-badge>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="results-section">
            <h3 class="results-title">Respuestas en {{activeCategory}} ({{responses().length}})</h3>

            <p-table [value]="responses()" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="5" styleClass="p-datatable-striped">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Respuesta</th>
                        <th>Categoría</th>
                        <th>Sede</th>
                        <th>Género</th>
                        <th>Fecha</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-response>
                    <tr>
                        <td>{{ response.response }}</td>
                        <td><p-tag [value]="response.category" [severity]="getSeverity(response.category)"></p-tag></td>
                        <td>{{ response.sede }}</td>
                        <td>{{ response.genero }}</td>
                        <td>{{ response.date }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4 text-500">No hay respuestas que coincidan con los filtros.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </p-card>
</div>
