<div class="flex h-full gap-4 p-4">
    <!-- Sidebar / Tree Hierarchy -->
    <div class="w-4">
        <p-card header="Estructura de Datos" styleClass="h-full">
            <div class="flex justify-content-end mb-2">
                <p-button icon="pi pi-refresh" (onClick)="refresh()" [text]="true"></p-button>
            </div>
            <p-tree
                [value]="nodes()"
                selectionMode="single"
                [(selection)]="selectedNode"
                (onNodeSelect)="onNodeSelect($event)"
                [filter]="true"
                filterPlaceholder="Buscar..."
                [loading]="loading"
                scrollHeight="600px">
            </p-tree>
        </p-card>
    </div>

    <!-- Main Content / Responses Table -->
    <div class="w-8">
        <p-card header="Respuestas" styleClass="h-full">
            <ng-template pTemplate="subtitle">
                <span *ngIf="selectedNode?.leaf">{{ selectedNode?.label }}</span>
                <span *ngIf="!selectedNode?.leaf">Seleccione una pregunta para ver las respuestas</span>
            </ng-template>

            <p-table
                [value]="responses()"
                [paginator]="true"
                [rows]="10"
                styleClass="p-datatable-sm"
                [showCurrentPageReport]="true">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 40%">Respuesta</th>
                        <th>Programa</th>
                        <th>Género</th>
                        <th>Sede</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-response>
                    <tr>
                        <td>{{ response.responseText }}</td>
                        <td><p-tag [value]="response.programa" severity="info"></p-tag></td>
                        <td>{{ response.sexoBiologico }}</td>
                        <td>{{ response.universidad }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="4" class="text-center p-4">No hay respuestas disponibles.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
