<div class="flex h-full gap-3 p-3">
    <!-- Sidebar: Questions List -->
    <div class="w-4 flex flex-column gap-2">
        <p-card styleClass="h-full flex flex-column">
            <ng-template pTemplate="header">
                <div class="p-3 pb-0">
                    <span class="font-bold text-lg mb-2 block">Preguntas Disponibles</span>
                    <p-iconField iconPosition="left" class="w-full">
                        <p-inputIcon styleClass="pi pi-search" />
                        <input type="text" pInputText [(ngModel)]="filterText" placeholder="Buscar pregunta..." class="w-full" />
                    </p-iconField>
                </div>
            </ng-template>

            <div class="overflow-auto h-full mt-2">
                <p-listbox
                    [options]="filteredQuestions()"
                    [(ngModel)]="selectedQuestion"
                    optionLabel="text"
                    [listStyle]="{'max-height': 'calc(100vh - 200px)'}"
                    (onChange)="onQuestionSelect($event)"
                    styleClass="w-full border-none">
                    <ng-template let-q pTemplate="item">
                        <div class="white-space-normal text-sm">{{q.text}}</div>
                    </ng-template>
                </p-listbox>
            </div>
        </p-card>
    </div>

    <!-- Main Content: Tabs & Responses -->
    <div class="w-8">
        <p-card styleClass="h-full">
            <div *ngIf="!selectedQuestion" class="flex flex-column align-items-center justify-content-center h-full text-500">
                <i class="pi pi-comments text-6xl mb-3"></i>
                <span class="text-xl">Selecciona una pregunta para ver las respuestas.</span>
            </div>

            <div *ngIf="selectedQuestion" class="h-full flex flex-column">
                <h2 class="text-xl font-bold mt-0 mb-3 text-primary">{{selectedQuestion.text}}</h2>

                <p-tabView styleClass="h-full">
                    <p-tabPanel *ngFor="let group of groupedResponses()" [header]="group.category">
                        <p-table
                            [value]="group.items"
                            [paginator]="true"
                            [rows]="10"
                            styleClass="p-datatable-sm p-datatable-gridlines"
                            [scrollable]="true"
                            scrollHeight="500px">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th style="width: 50%">Respuesta</th>
                                    <th>Programa</th>
                                    <th>Género</th>
                                    <th>Sede</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-response>
                                <tr>
                                    <td>{{ response.responseText }}</td>
                                    <td><p-tag [value]="response.programa" severity="info"></p-tag></td>
                                    <td>{{ response.sexoBiologico }}</td>
                                    <td>{{ response.universidad }}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </p-tabPanel>

                    <p-tabPanel *ngIf="groupedResponses().length === 0" header="Sin Datos">
                        <div class="p-3 text-center">No hay respuestas para esta pregunta.</div>
                    </p-tabPanel>
                </p-tabView>
            </div>
        </p-card>
    </div>
</div>
