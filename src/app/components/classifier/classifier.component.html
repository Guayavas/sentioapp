<p-toast></p-toast>

<div class="p-4 h-full flex flex-column">
    <div class="flex justify-content-between align-items-center mb-3">
        <h2 class="m-0 text-xl font-bold">Clasificador de Información</h2>

        <div *ngIf="previewData.length > 0" class="flex gap-2">
            <p-button label="Descartar" icon="pi pi-trash" styleClass="p-button-danger p-button-outlined" (onClick)="discard()"></p-button>
            <p-button label="Aprobar y Guardar" icon="pi pi-check" styleClass="p-button-success" (onClick)="approve()" [loading]="isUploading"></p-button>
        </div>
    </div>

    <!-- Upload Area (Visible only when empty) -->
    <div *ngIf="previewData.length === 0" class="flex-grow-1 flex align-items-center justify-content-center surface-50 border-round-xl border-2 border-dashed border-300">
        <div class="text-center">
            <i class="pi pi-cloud-upload text-6xl text-400 mb-3"></i>
            <h3 class="text-xl font-medium text-700 m-0 mb-3">Sube tu archivo Excel aquí</h3>
            <p-fileUpload
                mode="basic"
                name="file"
                chooseLabel="Seleccionar Archivo"
                accept=".xlsx,.xlsm"
                [auto]="true"
                customUpload="true"
                (uploadHandler)="onUpload($event)">
            </p-fileUpload>
            <p class="text-500 mt-2 text-sm">El archivo anterior será reemplazado si subes uno nuevo.</p>
        </div>
    </div>

    <!-- Editable Preview Table -->
    <div *ngIf="previewData.length > 0" class="flex-grow-1 overflow-auto border-1 surface-border border-round">
        <p-table [value]="previewData" [scrollable]="true" scrollHeight="flex" styleClass="p-datatable-sm p-datatable-gridlines">
            <ng-template pTemplate="header">
                <tr>
                    <th style="min-width: 200px">Pregunta (Editable)</th>
                    <th style="min-width: 150px">Categoría (Editable)</th>
                    <th style="min-width: 300px">Respuesta (Editable)</th>
                    <th>Programa</th>
                    <th>Género</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-item>
                <tr>
                    <td pEditableColumn>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="item.questionText" class="w-full">
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{item.questionText}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td pEditableColumn>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <input pInputText type="text" [(ngModel)]="item.categoryName" class="w-full">
                            </ng-template>
                            <ng-template pTemplate="output">
                                <span class="font-bold text-primary">{{item.categoryName}}</span>
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td pEditableColumn>
                        <p-cellEditor>
                            <ng-template pTemplate="input">
                                <textarea pInputTextarea [(ngModel)]="item.responseText" class="w-full" rows="2"></textarea>
                            </ng-template>
                            <ng-template pTemplate="output">
                                {{item.responseText}}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    <td>{{item.programa}}</td>
                    <td>{{item.sexoBiologico}}</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
