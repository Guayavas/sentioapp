<div class="min-h-screen flex flex-col bg-gray-50">
  <!-- Header Placeholder (To be replaced by dedicated component later if needed, or kept simple) -->
  <header class="bg-[#00923f] border-b border-green-700 shadow-sm">
      <div class="container mx-auto px-4 py-4">
        <div class="flex items-center space-x-3">
            <i class="pi pi-verified text-white text-3xl"></i>
            <div>
              <h1 class="text-xl font-semibold text-white m-0">SentioApp</h1>
              <p class="text-sm text-green-100 m-0">Bienestar Estudiantil</p>
            </div>
        </div>
      </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <p-card styleClass="w-full max-w-md bg-white shadow-lg">
      <ng-template pTemplate="header">
          <div class="text-center pt-6">
              <h2 class="text-2xl font-bold text-gray-900 m-0 mb-2">Iniciar Sesión</h2>
              <p class="text-gray-600 m-0">Accede al sistema de bienestar estudiantil</p>
          </div>
      </ng-template>

      <div class="space-y-4 p-fluid">
        <div class="field">
          <label for="username" class="block text-gray-700 font-medium mb-2">Usuario</label>
          <input pInputText id="username" [(ngModel)]="username" placeholder="Ingresa tu usuario" class="w-full" />
        </div>
        <div class="field mt-4">
          <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
          <p-password id="password" [(ngModel)]="password" [feedback]="false" placeholder="••••••••" styleClass="w-full" inputStyleClass="w-full"></p-password>
        </div>
        <div class="mt-6">
            <p-button label="Iniciar Sesión" (click)="login()" styleClass="w-full bg-[#00923f] border-[#00923f] hover:bg-green-700"></p-button>
        </div>
      </div>
    </p-card>
  </main>

  <footer class="bg-[#00923f] text-white py-6 mt-auto">
      <div class="container mx-auto px-4 text-center">
        <p class="text-sm">© 2025 Universidad de Nariño - SentioApp</p>
        <p class="text-xs text-green-100 mt-1">Todos los derechos reservados. Sistema de Gestión de Bienestar Estudiantil</p>
      </div>
  </footer>
</div>
