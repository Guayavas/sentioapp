<div class="min-h-screen flex flex-column bg-gray-50">
  <!-- Header -->
  <header class="bg-primary p-3 shadow-2">
      <div class="flex align-items-center gap-3 px-4">
          <i class="pi pi-verified text-white text-3xl"></i>
          <div>
            <h1 class="text-xl font-semibold text-white m-0">SentioApp</h1>
            <p class="text-sm text-white-alpha-80 m-0">Bienestar Estudiantil</p>
          </div>
      </div>
  </header>

  <!-- Main Content Centered -->
  <main class="flex-1 flex align-items-center justify-content-center p-4">
    <p-card styleClass="w-full md:w-30rem shadow-4 border-round-xl">
      <ng-template pTemplate="header">
          <div class="text-center pt-5 pb-2">
              <h2 class="text-2xl font-bold text-900 m-0 mb-2">Iniciar Sesión</h2>
              <p class="text-600 m-0">Accede al sistema de bienestar estudiantil</p>
          </div>
      </ng-template>

      <div class="flex flex-column gap-4 p-fluid">
        <div class="field">
          <label for="username" class="block text-900 font-medium mb-2">Usuario</label>
          <input pInputText id="username" [(ngModel)]="username" placeholder="Ingresa tu usuario" class="w-full" />
        </div>
        <div class="field">
          <label for="password" class="block text-900 font-medium mb-2">Contraseña</label>
          <p-password id="password" [(ngModel)]="password" [feedback]="false" placeholder="••••••••" styleClass="w-full" inputStyleClass="w-full"></p-password>
        </div>
        <div class="mt-2">
            <p-button label="Iniciar Sesión" (click)="login()" styleClass="w-full bg-primary border-primary hover:bg-green-700"></p-button>
        </div>
      </div>
    </p-card>
  </main>

  <!-- Footer -->
  <footer class="bg-primary text-white py-4 mt-auto">
      <div class="text-center">
        <p class="text-sm m-0">© 2025 Universidad de Nariño - SentioApp</p>
        <p class="text-xs text-white-alpha-80 mt-1 m-0">Todos los derechos reservados. Sistema de Gestión de Bienestar Estudiantil</p>
      </div>
  </footer>
</div>
